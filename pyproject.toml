[project]
name = "ballnet"
version = "0.1.0"
description = "Public NFL data pipeline and DS engine for Knowball visualizations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.23.14",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pyarrow>=25.0.1",
    "scipy>=1.18.0",
    "supabase>=2.31.0",
]

[project.scripts]
ballnet = "ballnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballnet"]

[tool.uv]
package = true
